<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .product-images {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .product-images img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .product-details {
      margin-top: 40px; /* space from images */
      text-align: center;
    }

    .product-details h1 {
      font-size: 24px;
      margin-bottom: 25px; /* extra space before buttons */
    }

    .order-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px; /* spacing from image */
    }

    .order-buttons a {
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-weight: 600;
      color: #fff;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
    }

    .order-buttons i {
      margin-right: 8px;
      font-size: 18px;
    }

    .whatsapp {
      background-color: #25D366;
    }

    .whatsapp:hover {
      background-color: #1da851;
    }

    .instagram {
      background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4);
    }

    .instagram:hover {
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      .product-details h1 {
        font-size: 20px;
      }

      .order-buttons {
        flex-direction: column;
      }

      .order-buttons a {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Product Images -->
    <div class="product-images">
      <img id="mainImg" src="" alt="Product image">
      <img id="secondImg" src="" alt="Second product image" style="display:none;">
    </div>

    <!-- Product Details -->
    <div class="product-details">
      <h1 id="productName"></h1>

      <div class="order-buttons">
        <a id="orderWhatsapp" class="whatsapp" href="#" target="_blank">
          <i class="fab fa-whatsapp"></i> Order on WhatsApp
        </a>
        <a id="orderInstagram" class="instagram" href="#" target="_blank">
          <i class="fab fa-instagram"></i> Order on Instagram
        </a>
      </div>
    </div>
  </div>

  <script>
    // Parse query parameters
    const params = new URLSearchParams(window.location.search);
    const productName = params.get('name') || "Product";
    const img = params.get('img') || "";
    const img2 = params.get('img2') || "";

    // Set product name and images
    document.getElementById('productName').textContent = productName;
    document.getElementById('mainImg').src = img;

    // Show second image only if it exists
    if (img2) {
      const secondImg = document.getElementById('secondImg');
      secondImg.src = img2;
      secondImg.style.display = "block";
    }

    // WhatsApp + Instagram links
    const whatsappNumber = "254798116042"; // ✅ no plus sign
    const instagramUser = "smith.in_4k"; 
    document.getElementById('orderWhatsapp').href = `https://wa.me/${whatsappNumber}?text=Hi! I'm interested in ${productName}`;
    document.getElementById('orderInstagram').href = `https://instagram.com/${instagramUser}`;
  </script>
</body>
</html>
